# yaml-language-server: $schema=../schema/component-spec.schema.json
name: EmptyState

platforms:
  web:
    path: apps/web/src/components/empty-state.tsx
    symbols: [EmptyState]
  ios:
    path: apps/ios/MemoTrail/DesignSystem/Components/MTFeedback.swift
    symbols: [MTEmptyState]

purpose: Explains why a region has nothing to show and, when there is one, offers the next step.

use:
  - A list, grid, or section with no records yet, such as an empty Library or a First Times page before the first First Time.
  - A search or filter that matched nothing, with a way to widen it.
  - A section that is itself the way to start, such as an empty Home Dashboard card, as one whole-state button.

avoid:
  - Content that is still loading. Use Skeleton on Web and MTLoadingSkeleton on iOS.
  - Errors and outcomes of an action. Use a toast or inline field feedback.
  - Explaining a page. Use the PageHeader description.

anatomy:
  container: The bordered, rounded surface that centers its content, or the whole button when the state is one action.
  icon: An optional accent icon on a soft accent tile above the title.
  title: The serif title that says what is missing.
  description: An optional sentence that says why, or what will appear here.
  actions: Optional buttons below the description, such as New entry.

props: {}

states: [default, hover, pressed, focus]

tokens:
  - container:
      background: "{color.surface}"
      border: "{color.border}"
      borderWidth: "{size.stroke.thin}"
      radius: "{radius.large}"
      gap: "{space.3}"
      paddingInline: { web: "{space.5}", ios: "{space.4}" }
      paddingBlock: { web: "{space.10}", ios: "{space.6}" }
    icon:
      size: "{size.emptyState.icon}"
      radius: "{radius.medium}"
      background: "{color.accentSubtle}"
      color: "{color.accent}"
    title:
      type: "{type.cardTitle}"
      color: "{color.ink}"
    description:
      fontSize: { web: "{font.size.label}" }
      type: { ios: "{type.supporting}" }
      lineHeight: "{lineHeight.body}"
      color: "{color.inkMuted}"
      maxWidth: "{size.emptyState.messageWidth}"
    actions:
      gap: "{space.2}"
  - when: { state: hover }
    container: { border: { web: "{color.accent}" } }
  - when: { state: pressed }
    container: { border: { ios: "{color.accent}" } }
  - when: { state: focus }
    container:
      border: { web: "{state.focus.ring}" }
      borderWidth: { web: "{state.focus.ringWidth}" }
      offset: { web: "{state.focus.ringOffset}" }

content:
  lines: unlimited
  overflow: wrap
  casing: sentence
  length: A title of two to five words and a description of one sentence, up to about 20 words.
  notes:
    - Say what will appear rather than that something is missing, such as Your trail starts here.
    - Name the action after what it does, such as New entry, not Get started.

accessibility:
  role: A group with a heading on Web and a container with a header on iOS. With one action for the whole state, it is a single button on both.
  label: The title and description in reading order. A whole-state button speaks both as its label.
  focus: Only the actions take focus, or the whole state when it is one button. Web draws the shared focus ring around the button.
  minimumHitTarget: notInteractive
  dynamicType: iOS scales the title and description with Dynamic Type and wraps them; the icon tile keeps its size. Web grows with browser zoom.

platformDifferences:
  - difference: Web pads the state 40 by 20 px above 560 px and 24 by 16 px below it; iOS always uses the 24 by 16 pt phone padding.
    reason: The iOS app runs only on iPhone, so it never reaches the wider layout.
  - difference: The description is 13 px label text on Web and the supporting text role on iOS, also 13 pt.
    reason: The supporting role scales with Dynamic Type's footnote style, which a fixed size would not.
  - difference: A whole-state button shows the accent border on hover on Web and while pressed on iOS.
    reason: Each platform's own feedback for a pointer and a touch.
  - difference: Web lets the caller choose an h2 or h3 title; iOS marks the title as a header without a level.
    reason: A Web page needs a heading outline, while VoiceOver moves between headers without levels in a SwiftUI screen.

specimens:
  - id: empty-state-with-action
    description: An icon, a title, a description, and one action, as an empty Library shows.
  - id: empty-state-informational
    description: A title and a description without an icon or action, for a section that fills in on its own.
  - id: empty-state-button
    description: The whole state as one button that starts the missing record.
