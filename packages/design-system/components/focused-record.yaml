# yaml-language-server: $schema=../schema/component-spec.schema.json
name: FocusedRecord

platforms:
  web:
    unavailable: Web has no separate focused record page. Every record is an Entry and opens on the Entry detail view, so a Chapter or First Time uses the Item page.
  ios:
    path: apps/ios/MemoTrail/DesignSystem/Components/MTRecordDetail.swift
    symbols:
      [
        MTFocusedRecordPage,
        MTFocusedRecordView,
        MTRecordPhotos,
        MTFactList,
        MTDetailSection,
      ]

purpose: A record's own page, with its Kind and title, an Edit action, its photos, its facts, its Story, and its tags.

use:
  - The native page a Home, Vehicle, or Someday item opens to from its card, until the native app moves to Entries.
  - Any native record whose page shows labeled facts and writing rather than an Entry's rich text.

avoid:
  - An Entry's Item page, which shows rich text, dates, and Location. Use the Entry detail view.
  - A record that cannot be opened. Use the focused unavailable page.

anatomy:
  container: The compact page frame that holds the page.
  header: The page header with the Kind as its eyebrow, the record's title, and a small ghost Edit button at the trailing edge.
  body: The column under the header that holds the photos, facts, and sections.
  photos: The record's saved photos at 4:3 in columns at least 220 points wide, each opening the photo viewer.
  facts: Labeled values, each under a hairline; empty values are left out.
  story: The record's writing under a rule and a Story section header, or Notes for a Someday item.
  organize: The record's tags as neutral badges under a rule and an Organize section header.
  extra: Further sections that belong to one Kind, such as the First Time a Someday item became.

props: {}

states: [default]

tokens:
  - container:
      maxWidth: "{layout.pageWidth.compact}"
      gap: "{space.6}"
    body:
      gap: "{space.8}"
    photos:
      minWidth: "{size.focusedRecord.photoColumn}"
      radius: "{radius.large}"
      gap: "{space.3}"
    facts:
      gap: "{space.5}"
      border: "{color.border}"
      borderWidth: "{size.stroke.thin}"
      color: "{color.inkMuted}"
      fontSize: "{font.size.caption}"
    story:
      border: "{color.border}"
      borderWidth: "{size.stroke.thin}"
      lineHeight: "{lineHeight.relaxed}"
      color: "{color.ink}"
    organize:
      border: "{color.border}"
      borderWidth: "{size.stroke.thin}"
      gap: "{space.2}"

content:
  lines: unlimited
  overflow: wrap
  casing: asWritten
  length: The title is the record's own name; fact labels are one to four words, such as Why you moved in.
  notes:
    - Section titles name what the section holds, such as Story, Notes, or Organize.
    - "Tags show with their leading #, such as #family."
    - A fact sits 12 points under its rule and a section 20 points under its rule, so the space separates it from the one before.

accessibility:
  role: A page whose title is its heading, with Story and Organize as section headings, and a description list of facts on Web.
  label: The title; Edit names its record, such as Edit Home, and each photo button names its photo, such as Preview Blue Civic photo 2.
  focus: Edit comes first, then each photo, then any links in the sections.
  minimumHitTarget: "{size.hitTarget}"
  dynamicType: Text scales with Dynamic Type on iOS and browser zoom on Web; photo columns reflow, and facts stack in one column on phones.

platformDifferences:
  - difference: iOS only. Web has no focused record page.
    reason: Web retired Homes, Vehicles, and Someday items as separate records, and each is now an Entry on the Item page. The iOS page goes with the native move to Entries.

specimens:
  - id: focused-record-home
    description: A Home's page with its photos, facts, Story, and tags, and Edit beside the title.
