name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web and shared checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Check generated design tokens
        run: pnpm tokens:check

      - name: Lint, type-check, and test Web contracts
        run: pnpm turbo run lint typecheck test

      - name: Build Web app
        run: pnpm build

      - name: Verify shipped media dependencies
        run: node apps/web/scripts/verify-media-trace.mjs

  ios:
    name: iOS build
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build iOS app
        run: |
          xcodebuild -quiet \
            -project apps/ios/MemoTrail.xcodeproj \
            -scheme MemoTrail \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

  database:
    name: Supabase database tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.116.0
          github-token: ${{ github.token }}

      - name: Start local database
        run: supabase db start

      - name: Run database tests
        run: supabase test db
