name: CI

# Pull requests carry the full validation. Merged branches are not tested again on
# main, and documentation-only or native-only changes skip these Linux jobs, to
# keep this private repository within its Actions minutes.
on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "timeline-ideas/**"
      - "apps/ios/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web and shared checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Check generated design tokens
        run: pnpm design-system:check

      - name: Lint, type-check, and test Web contracts
        run: pnpm turbo run lint typecheck test

      - name: Build Web app
        run: pnpm build

      - name: Verify shipped media dependencies
        run: node apps/web/scripts/verify-media-trace.mjs

  supabase:
    name: Supabase database, data contract, and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.116.0
          github-token: ${{ github.token }}

      # Web uses neither Realtime nor Storage image transforms, and tests sign in
      # through the admin API instead of email.
      - name: Start local Supabase
        run: supabase start -x studio,realtime,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database tests
        run: supabase test db

      - name: Run multi-client data contracts
        run: pnpm --filter @memotrail/web test:contracts

      # The runner image includes Google Chrome, which the suite uses directly.
      - name: Run product browser suite against a production build
        env:
          MEMOTRAIL_E2E_PRODUCTION: "1"
        run: pnpm --filter @memotrail/web test:e2e --reporter=github,line

      # Search by meaning runs against a fake embedding service in its own development
      # server, so the production suite above stays keyword-only.
      - name: Run semantic search browser suite
        run: pnpm --filter @memotrail/web test:e2e:semantic --reporter=github,line

      - name: Keep browser failure output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results
          path: apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore
